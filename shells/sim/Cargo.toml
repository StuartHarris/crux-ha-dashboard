[package]
name = "sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Desktop simulator: runs the core and draws the panel with the same code as the firmware."

[dependencies]
shared = { workspace = true, features = ["std", "fixtures"] }
ui.workspace = true
crux_core.workspace = true
crux_time = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock", "std"] }
embedded-graphics.workspace = true
# The simulator uses the display of the simulator crate as the panel, for its
# `diff` and its PNG output. It does not use SDL.
embedded-graphics-simulator = { version = "0.8.0", default-features = false }
# The core runs MQTT. The shell gives it a TCP stream to the broker, with no
# TLS, because the broker is on the LAN.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
# The window. eframe runs egui on winit and draws with OpenGL (glow). It
# loads X11 or Wayland at run time, so a build on Linux needs no system
# packages.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[lints]
workspace = true
