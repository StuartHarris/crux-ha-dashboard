[package]
name = "firmware-logic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The parts of the firmware shell that do not touch the hardware, so that they can be tested on the host"

[lib]
name = "logic"

[dependencies]
crux_core.workspace = true
crux_time.workspace = true
embedded-graphics.workspace = true
log.workspace = true
# Atomics that esp-hal accepts in RTC memory that a reset keeps. Refer to
# `src/boot.rs`.
portable-atomic = { version = "1.15", default-features = false }
shared.workspace = true
ui.workspace = true

[dev-dependencies]
# Tests run on the host, so they can use the `fixtures` feature of `shared`,
# which turns on `std` and gives the fake broker. The library build must not
# use it.
shared = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
