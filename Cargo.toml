[workspace]
members = ["shared", "ui", "shells/sim", "firmware/logic"]
# The firmware builds for the ESP32-S3 in its own workspace. If it were a member,
# feature unification with the std shells would pull std into the firmware.
# The firmware logic (`firmware/logic`) has no hardware code, so it is a member
# here, and its tests run on the host.
exclude = ["firmware"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Crux with no_std support. Pinned to a commit on the `spike/no-std` branch.
crux_core = { git = "https://github.com/redbadger/crux", rev = "890ab0e17e818addb74a5bd70f51db2d606d314a", default-features = false, features = ["crux_macros"] }
crux_time = { git = "https://github.com/redbadger/crux", rev = "890ab0e17e818addb74a5bd70f51db2d606d314a", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
facet = { version = "=0.46.5", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
embedded-graphics = "0.8.2"

# Members opt in to `std`. The `ui` crate must never turn it on.
shared = { path = "shared", default-features = false }
ui = { path = "ui" }
