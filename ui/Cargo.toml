[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Draws the view model with embedded-graphics. The simulator and the firmware both use it."

[dependencies]
embedded-graphics.workspace = true
shared.workspace = true

[dev-dependencies]
# Tests need the `std` feature of `shared`, but the library build must not use it.
shared = { workspace = true, features = ["std"] }

[lints]
workspace = true
