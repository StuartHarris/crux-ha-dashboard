name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CI: 1
  # sccache stores compiled crates in the GitHub Actions cache.
  # It cannot cache incremental builds, so turn them off.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: 0

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs stable with rustfmt,
      # clippy and the thumbv7em target when a cargo command first runs.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Check, build and test
        run: just check-host build test

  esp:
    runs-on: ubuntu-latest
    env:
      ESPUP_VERSION: 0.19.0
      ESP_TOOLCHAIN: 1.97.0.0
    steps:
      - uses: actions/checkout@v7

      # espup and the esp toolchain come from GitHub release downloads, and
      # these downloads sometimes fail with a 504. The cache keeps the
      # toolchain and `~/export-esp.sh` between runs, so most runs download
      # nothing. The recipes read `~/export-esp.sh` themselves. To change a
      # version, change `ESPUP_VERSION` or `ESP_TOOLCHAIN`, which also
      # changes the cache key.
      - name: Restore the esp toolchain
        id: esp-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/export-esp.sh
          key: esp-${{ runner.os }}-espup-${{ env.ESPUP_VERSION }}-${{ env.ESP_TOOLCHAIN }}-esp32s3

      - name: Install the esp toolchain
        if: steps.esp-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 15 \
            --output espup.zip \
            "https://github.com/esp-rs/espup/releases/download/v${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu.zip"
          unzip -o espup.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/espup"
          for attempt in 1 2 3; do
            espup install --targets esp32s3 --toolchain-version "$ESP_TOOLCHAIN" \
              --export-file "$HOME/export-esp.sh" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 30
          done

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check the no_std build
        run: just check-nostd

      # The example configuration has placeholders, not real credentials.
      - name: Build the firmware
        env:
          DASHBOARD_CONFIG: cfg.toml.example
        run: just firmware build
