[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["std"]
# On by default. Turn it off to build the core for the device.
std = [
    "crux_core/std",
    "crux_time/std",
    "futures/std",
    "jiff/std",
    "serde/std",
    "serde_json/std",
]

# A shell with fixed answers, for the golden-image tests and the PNG mode of
# the simulator.
fixtures = ["std"]

[dependencies]
jiff.workspace = true
crux_core.workspace = true
crux_time.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
crux_core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
